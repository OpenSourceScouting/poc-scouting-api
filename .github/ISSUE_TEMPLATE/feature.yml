name: Feature request
description: Propose a new API capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and why?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed contract
      description: Endpoints, fields, and example requests/responses.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: My team can contribute this change (InnerSource)
