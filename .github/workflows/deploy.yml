name: Deploy

# Deployment is disabled: there is no hosting infrastructure yet, and the hosting platform for step 2 (Walk)
# is not decided. The workflow does not run on push. A manual start also skips the job until a repository
# administrator sets the repository variable DEPLOY_ENABLED to "true".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Configure required reviewers on the "production" GitHub environment for a manual gate.
    environment: ${{ inputs.environment || 'staging' }}
    concurrency: deploy-${{ inputs.environment || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # Migrations run before code so new code never sees an old schema. Keep migrations additive.
      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply DB --remote --env "$TARGET"
      # Via the npm script so predeploy vendors the self-hosted Swagger UI into the static assets.
      - name: Deploy Worker
        run: npm run "deploy:$TARGET" -w @scouting/api
