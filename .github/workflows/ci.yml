name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Contract is up to date
        run: |
          npm run generate
          git diff --exit-code -- openapi/ packages/api-client/src/schema.d.ts \
            || (echo "::error::OpenAPI contract drifted. Run 'npm run generate' and commit the result." && exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run docs

  # Blocks removed fields, new required params, narrowed enums, etc. Additive changes pass.
  breaking-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oasdiff/oasdiff-action/breaking@v0.1.21
        with:
          base: origin/${{ github.base_ref }}:openapi/openapi.json
          revision: HEAD:openapi/openapi.json
          fail-on: ERR

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/tofu
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false
      - run: tofu validate
      # Offline tests with a mocked Cloudflare provider (infra/tofu/tests).
      - run: tofu test
